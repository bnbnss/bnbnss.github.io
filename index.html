<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滴滴答滴答v1.0</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="petals">
    <span class="petal"></span><span class="petal"></span><span class="petal"></span>
    <span class="petal"></span><span class="petal"></span><span class="petal"></span>
    <span class="petal"></span><span class="petal"></span><span class="petal"></span>
    <span class="petal"></span><span class="petal"></span><span class="petal"></span>
  </div>
  <div class="login-card">
    <div class="login-icon">卡</div>
    <div class="login-title">授权验证</div>
    <div class="login-sub">输入兑换码完成验证后即可<br>正常使用相关功能</div>
    <input id="cardKey" type="text" placeholder="输入18位兑换码" autocomplete="off" maxlength="18">
    <div class="login-msg" id="loginMsg" hidden></div>
    <button type="button" id="loginBtn" class="login-main-btn">立即验证</button>
    <div class="login-row">
      <button type="button" class="login-sub-btn" id="usageBtn">使用说明</button>
      <button type="button" class="login-sub-btn" id="buyBtn">购买授权</button>
    </div>
    <div class="login-tips">
      温馨提示：<br>
      请根据产品授权协议与平台规则合规使用。<br>
      如有问题，请联系售后或客服。
    </div>
  </div>
  <div class="buy-pop" id="buyPop" hidden>
    <div class="buy-pop-card">
      <div class="buy-pop-title" id="buyPopTitle">周卡 · 7天</div>
      <div class="buy-pop-qr">
        <img id="buyPopQrImg" alt="扫码购买">
        <div class="buy-pop-qr-tip">扫码或长按识别二维码</div>
      </div>
      <div class="buy-pop-tabs">
        <button type="button" class="buy-pop-tab active" data-k="week">周卡 · 7天</button>
        <button type="button" class="buy-pop-tab" data-k="month">月卡 · 30天</button>
        <button type="button" class="buy-pop-tab" data-k="year">年卡 · 365天</button>
      </div>
      <button type="button" class="buy-pop-close" id="buyPopClose">关闭</button>
    </div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">滴滴答滴答v1.0</div>
      <div class="brand-meta">
        <span class="cdk-code" id="cdkCode">--</span>
        <span class="cdk-time" id="cdkTime">到期 --</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="wechat">微信</button>
      <button class="tab" data-tab="alipay">支付宝</button>
      <button class="tab" data-tab="etc">ETC充电</button>
      <button class="tab" data-tab="parking">停车票</button>
    </nav>
  </header>

  <section class="panel form-panel" id="formPanel">
    <div class="field avatar-field">
      <label>头像</label>
      <div class="avatar-box">
        <img id="avatarImg" alt="头像">
        <div class="avatar-btns">
          <button type="button" id="pickAvatarBtn" class="btn ghost">选择头像</button>
          <button type="button" id="uploadAvatarBtn" class="btn ghost">上传图片</button>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
      </div>
    </div>

    <div class="field" id="merchantField">
      <label>商户</label>
      <div class="sel-wrap">
        <input id="merchantSel" type="text" placeholder="选择或直接修改商户名称" autocomplete="off">
        <button type="button" id="merchantArrow" class="sel-arrow" tabindex="-1" aria-label="展开商户列表">▾</button>
      </div>
      <div class="merchant-drop" id="merchantDrop" hidden></div>
    </div>

    <div class="field" id="plateField" hidden>
      <label>车牌号（自动匹配地区）</label>
      <div class="input-btn">
        <input id="plateNumber" type="text" placeholder="例：豫A12345">
        <button type="button" id="randPlate" class="btn ghost">随机</button>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>金额（元）</label>
        <input id="amount" type="text" inputmode="decimal" value="888.00">
      </div>
      <div class="field">
        <label>支付方式</label>
        <input id="paymentMethod" type="text" value="零钱">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>日期</label>
        <input id="datePart" type="date">
      </div>
      <div class="field">
        <label>时间</label>
        <input id="timePart" type="time" step="1">
      </div>
    </div>

    <div class="field foldable" data-fold="productName">
      <label>商品名称<span class="fold-hint">自动生成，如需修改请展开</span><span class="fold-arrow">▾</span></label>
      <input id="productName" type="text">
    </div>

    <div class="field foldable" id="productCodeField" data-fold="productCode">
      <label>商品订单号<span class="fold-hint">订单号自动生成，如需修改请展开</span><span class="fold-arrow">▾</span></label>
      <div class="input-btn">
        <input id="productCode" type="text" placeholder="如果需要随机订单号">
        <label class="check-inline"><input type="checkbox" id="randomOrderChk"> 随机</label>
      </div>
    </div>

    <div class="field foldable" data-fold="tradeNumber">
      <label>交易单号<span class="fold-hint">随机号码已生效，想修改请展开</span><span class="fold-arrow">▾</span></label>
      <div class="input-btn">
        <input id="tradeNumber" type="text">
        <button type="button" id="genTradeNumber" class="btn ghost">随机</button>
      </div>
    </div>

    <div class="field foldable" data-fold="barcodeNumber">
      <label>条码编号<span class="fold-hint">随机号码已生效，想修改请展开</span><span class="fold-arrow">▾</span></label>
      <div class="input-btn">
        <input id="barcodeNumber" type="text">
        <button type="button" id="genBarcode" class="btn ghost">随机</button>
      </div>
    </div>

    <div class="field foldable" data-fold="acquirer">
      <label>收单机构<span class="fold-hint">自动匹配，如需修改请展开</span><span class="fold-arrow">▾</span></label>
      <input id="acquirer" type="text">
    </div>

    <div class="field foldable" data-fold="clearingService">
      <label>清算服务<span class="fold-hint">自动匹配，如需修改请展开</span><span class="fold-arrow">▾</span></label>
      <input id="clearingService" type="text">
    </div>

    <button type="button" id="generateBtn" class="btn primary block">生成预览</button>
  </section>

  <section class="panel preview-panel" id="previewPanel" hidden>
    <div class="preview-head">
      <button type="button" id="backBtn" class="btn ghost">← 返回修改</button>
      <button type="button" id="downloadBtn" class="btn primary">保存图片</button>
    </div>
    <div class="canvas-wrap">
      <div id="renderStage" hidden></div>
      <img id="previewImg" alt="预览" hidden>
    </div>
    <div class="save-hint">长按图片保存到相册</div>
  </section>
</div>

<div class="modal" id="avatarModal" hidden>
  <div class="modal-body">
    <div class="modal-head">
      <span>选择头像</span>
      <button type="button" class="modal-close" id="closeModal">×</button>
    </div>
    <div class="avatar-list" id="avatarGrid"></div>
  </div>
</div>

<div class="modal" id="cropModal" hidden>
  <div class="modal-body">
    <div class="modal-head">
      <span>上传头像</span>
      <button type="button" class="modal-close" id="cropClose">×</button>
    </div>
    <div class="crop-body">
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="">
        <div class="crop-mask"></div>
      </div>
      <div class="crop-hint">拖动图片调整位置</div>
      <div class="field">
        <label>公司完整名称</label>
        <input id="cropCompanyName" type="text" placeholder="请输入公司完整名称">
      </div>
    </div>
    <div class="crop-foot">
      <button type="button" class="btn ghost" id="cropCancel">取消</button>
      <button type="button" class="btn primary" id="cropOk">确定</button>
    </div>
  </div>
</div>

<script>
(function () {
  var hadError = false;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT' && t.src) {
      hadError = true;
      try {
        if (sessionStorage.getItem('bill_sreload')) return;
        sessionStorage.setItem('bill_sreload', '1');
      } catch (err) { return; }
      location.reload();
    }
  }, true);
  window.addEventListener('load', function () {
    if (hadError) return;
    try { sessionStorage.removeItem('bill_sreload'); } catch (err) {}
  });
})();
</script>
<script src="js/avatars.js"></script>
<script src="js/regions.js"></script>
<script src="js/ZFBregions.js"></script>
<script src="js/code128.js"></script>
<script src="js/render.js"></script>
<script src="js/tpl-data.js"></script>
<script src="js/html2canvas.min.js"></script>
<script src="js/qr.js"></script>
<script src="js/protect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
